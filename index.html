<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MiniGram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { background: #0e1621; color: #fff; height: 100vh; overflow: hidden; }
  .screen { height: 100vh; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* --- Логин --- */
  #login-screen {
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #17212b, #0e1621);
  }
  .login-box {
    background: #17212b; padding: 40px; border-radius: 16px;
    width: 320px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .login-box h1 { color: #5288c1; margin-bottom: 8px; }
  .login-box p { color: #7f91a4; margin-bottom: 24px; font-size: 14px; }
  .login-box input {
    width: 100%; padding: 12px; border-radius: 8px;
    border: 1px solid #2b3a4a; background: #0e1621;
    color: #fff; margin-bottom: 12px; font-size: 15px; outline: none;
  }
  .login-box input:focus { border-color: #5288c1; }
  .login-box button {
    width: 100%; padding: 12px; background: #5288c1; color: #fff;
    border: none; border-radius: 8px; font-size: 15px;
    cursor: pointer; font-weight: 600;
  }
  .login-box button:hover { background: #4a7ab0; }

  /* --- Чат --- */
  .chat-header {
    display: flex; align-items: center; padding: 12px 16px;
    background: #17212b; border-bottom: 1px solid #0e1621;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: #5288c1; display: flex; align-items: center;
    justify-content: center; font-weight: bold; margin-right: 12px;
  }
  .chat-info h2 { font-size: 16px; }
  .chat-info span { font-size: 12px; color: #7f91a4; }
  #logout-btn {
    margin-left: auto; background: transparent; border: none;
    color: #7f91a4; font-size: 20px; cursor: pointer;
  }
  .messages {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #2b3a4a; border-radius: 3px; }
  .msg {
    max-width: 70%; padding: 8px 12px; border-radius: 12px;
    background: #182533; align-self: flex-start;
    word-wrap: break-word; animation: pop .15s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .msg.own { background: #2b5278; align-self: flex-end; }
  .msg .name { font-size: 12px; color: #5288c1; font-weight: 600; margin-bottom: 2px; }
  .msg.own .name { color: #8ec5ff; }
  .msg .text { font-size: 14px; line-height: 1.4; }
  .msg .time { font-size: 10px; color: #7f91a4; margin-top: 3px; text-align: right; }
  .chat-input {
    display: flex; padding: 10px 12px; background: #17212b;
    border-top: 1px solid #0e1621; gap: 8px;
  }
  .chat-input input {
    flex: 1; padding: 12px 16px; border-radius: 20px; border: none;
    background: #0e1621; color: #fff; outline: none; font-size: 14px;
  }
  .chat-input button {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #5288c1; color: #fff; font-size: 18px; cursor: pointer;
  }
  .chat-input button:hover { background: #4a7ab0; }
</style>
</head>
<body>
<div id="app">
  <!-- Экран входа -->
  <div id="login-screen" class="screen">
    <div class="login-box">
      <h1>MiniGram</h1>
      <p>Введите имя, чтобы начать</p>
      <input id="username-input" type="text" placeholder="Ваше имя" maxlength="20"/>
      <button id="login-btn">Войти</button>
    </div>
  </div>

  <!-- Основной чат -->
  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="avatar">#</div>
      <div class="chat-info">
        <h2>Общий чат</h2>
        <span id="online-count">онлайн: 1</span>
      </div>
      <button id="logout-btn" title="Выйти">⏻</button>
    </header>
    <div id="messages" class="messages"></div>
    <footer class="chat-input">
      <input id="message-input" type="text" placeholder="Написать сообщение..." autocomplete="off"/>
      <button id="send-btn">➤</button>
    </footer>
  </div>
</div>

<script type="module">
// ============== FIREBASE КОНФИГ ==============
// Замени на свой конфиг из Firebase Console
const firebaseConfig = {
  apiKey: "ТВОЙ_API_KEY",
  authDomain: "ТВОЙ_PROJECT.firebaseapp.com",
  databaseURL: "https://ТВОЙ_PROJECT-default-rtdb.firebaseio.com",
  projectId: "ТВОЙ_PROJECT",
  storageBucket: "ТВОЙ_PROJECT.appspot.com",
  messagingSenderId: "ТВОЙ_ID",
  appId: "ТВОЙ_APP_ID"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase, ref, push, onValue, onDisconnect,
  serverTimestamp, set, query, limitToLast
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// ============== ЛОГИКА ==============
let username = localStorage.getItem("username") || "";
let userId   = localStorage.getItem("userId")   || crypto.randomUUID();
localStorage.setItem("userId", userId);

const $ = id => document.getElementById(id);

if (username) enterChat();

$("login-btn").onclick = () => {
  const name = $("username-input").value.trim();
  if (!name) return alert("Введите имя!");
  username = name;
  localStorage.setItem("username", username);
  enterChat();
};

$("message-input").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});
$("send-btn").onclick = sendMessage;

$("logout-btn").onclick = () => {
  localStorage.removeItem("username");
  location.reload();
};

function enterChat() {
  $("login-screen").classList.add("hidden");
  $("chat-screen").classList.remove("hidden");
  listenMessages();
  setupPresence();
}

function sendMessage() {
  const input = $("message-input");
  const text = input.value.trim();
  if (!text) return;

  push(ref(db, "messages"), {
    user: username,
    uid: userId,
    text: text,
    time: serverTimestamp()
  });

  input.value = "";
  input.focus();
}

function listenMessages() {
  const msgsRef = query(ref(db, "messages"), limitToLast(100));
  onValue(msgsRef, snapshot => {
    const container = $("messages");
    container.innerHTML = "";

    snapshot.forEach(child => {
      const m = child.val();
      const div = document.createElement("div");
      div.className = "msg" + (m.uid === userId ? " own" : "");

      const time = m.time
        ? new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        : "";

      div.innerHTML = `
        ${m.uid !== userId ? `<div class="name">${escapeHtml(m.user)}</div>` : ""}
        <div class="text">${escapeHtml(m.text)}</div>
        <div class="time">${time}</div>
      `;
      container.appendChild(div);
    });

    container.scrollTop = container.scrollHeight;
  });
}

function setupPresence() {
  const userStatusRef = ref(db, "online/" + userId);
  const connectedRef  = ref(db, ".info/connected");
  const onlineListRef = ref(db, "online");

  onValue(connectedRef, snap => {
    if (!snap.val()) return;
    onDisconnect(userStatusRef).remove();
    set(userStatusRef, { name: username });
  });

  onValue(onlineListRef, snap => {
    const count = snap.exists() ? Object.keys(snap.val()).length : 0;
    $("online-count").textContent = `онлайн: ${count}`;
  });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
</script>
</body>
</html>
